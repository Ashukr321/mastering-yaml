# =====================================================================
# Project 03 · i18n Translations                         Level: ⭐
# File: locales/hi.yaml
# Scenario: The same ShopKart app in Hindi. Every key must match en.yaml exactly,
#           only the values change. YAML files are UTF-8, so Devanagari text just works.
# Solution: every TODO is answered and marked DONE(n).
# Check: yamllint --strict .   then compare with ../solution
# =====================================================================
---
# ---------- Top navigation bar ----------
navbar:  # same keys as en.yaml, Hindi values
  home: होम  # "Home" - Indian apps usually keep this English word
  shop: खरीदारी करें  # "Shop" (literally "do shopping")
  cart: कार्ट  # "Cart"
  account: मेरा खाता  # "My Account"
  search_placeholder: उत्पाद खोजें...  # "Search products..."

# ---------- Words used everywhere ----------
common:  # shared labels
  yes_label: हाँ  # "Yes" - no quotes needed: a Hindi word is never read as a boolean
  no_label: नहीं  # "No" - plain string

# ---------- Shopping cart ----------
cart:  # texts on the cart page
  title: आपका कार्ट  # "Your Cart"
  empty: आपका कार्ट खाली है।  # "Your cart is empty." - "।" is the Hindi full stop
  # Hindi uses the same word for one and many items, but i18next still needs both keys.
  item_one: "{{count}} आइटम"
  item_other: "{{count}} आइटम"  # DONE(4): same text as item_one - quoted because it starts with "{"
  subtotal: "उप-योग: {{amount}}"  # "Subtotal" - quoted because of ": "

# ---------- Checkout ----------
checkout:  # texts on the checkout page
  title: चेकआउट  # "Checkout"
  # DONE(5): add a "steps" list with 3 items: डिलीवरी का पता, भुगतान, ऑर्डर की समीक्षा
  steps:  # same order as in en.yaml
    - डिलीवरी का पता  # list item 1: "Shipping address"
    - भुगतान  # list item 2: "Payment"
    - ऑर्डर की समीक्षा  # list item 3: "Review order"
  place_order: ऑर्डर करें  # "Place order"
  order_number: "ऑर्डर #{{id}}"  # "Order #..." - quoted because of " #"

# ---------- Error messages ----------
errors:  # error texts
  required: यह फ़ील्ड ज़रूरी है।  # "This field is required."
  network: नेटवर्क में गड़बड़ी। कृपया अपना इंटरनेट कनेक्शन जाँचें।  # "Network error. Please check..."
  # DONE(6): "Sorry, {{product}} is out of stock" in Hindi:
  #          "माफ़ कीजिए, {{product}} अभी स्टॉक में नहीं है।" - quote it, it contains {{ }}
  out_of_stock: "माफ़ कीजिए, {{product}} अभी स्टॉक में नहीं है।"

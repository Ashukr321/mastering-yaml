# Scenario: Run the Node.js shop API and wire in its settings: env vars from the ConfigMap,
#           passwords from the Secret, and app.json mounted as a real file.
# Task: replace every ___ and complete every TODO(n). Hints are inline.
# Check: yamllint --strict .   then compare with ../solution

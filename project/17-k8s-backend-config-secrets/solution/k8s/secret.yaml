# =====================================================================
# Project 17 · K8s Backend Config & Secrets               Level: ⭐⭐⭐⭐
# File: k8s/secret.yaml
# Scenario: The API needs a database password and a JWT signing key. They must not be
#           baked into the image or stored in the ConfigMap.
# Solution: every TODO is answered and marked DONE(n).
# Check: yamllint --strict .   then compare with ../solution
# =====================================================================
---
# !!! WARNING: NEVER commit real secrets to git. Not even in a private repo. !!!
# The values below are obvious placeholders for learning only.
# In a real project, create the Secret from the command line or a CI secret, e.g.
#   kubectl -n shop create secret generic shop-api-secrets --from-literal=DB_PASSWORD=...
# or use a tool such as Sealed Secrets, SOPS or External Secrets Operator.
# Also note: a Secret is only base64-ENCODED, not encrypted. Anyone who can read it can decode it.
apiVersion: v1  # Secrets are in the core API group
kind: Secret  # like a ConfigMap, but for sensitive values; access can be locked down with RBAC
metadata:  # information that identifies this object
  name: shop-api-secrets  # the Deployment refers to this exact name in secretKeyRef
  namespace: shop  # a pod can only read Secrets in its own namespace
  labels:  # tags for finding related objects
    app: shop-api  # belongs to the shop API
type: Opaque  # DONE(1): the generic Secret type for any key/value data you define yourself
# `stringData` takes plain text and Kubernetes base64-encodes it into `data` for you.
# (With `data:` instead, you would have to base64-encode every value yourself.)
stringData:
  DB_USER: shop_app  # the database user name the API logs in as
  DB_PASSWORD: "CHANGE_ME_db_password"  # DONE(2): a quoted placeholder, "CHANGE_ME_db_password"
  # long random string used to sign login tokens; generate one with: openssl rand -hex 32
  JWT_SECRET: "CHANGE_ME_jwt_signing_key"

# =====================================================================
# Project 15 · Production Docker Compose Stack             Level: ⭐⭐⭐
# File: docker-compose.prod.yml
# Scenario: A small shop runs its whole app on one VM: nginx in front, a Node API,
#           PostgreSQL and Redis. Start it with: docker compose -f docker-compose.prod.yml up -d
# Solution: every TODO is answered and marked DONE(n).
# Check: yamllint --strict .   then compare with ../solution
# =====================================================================
---
# No "version:" key: modern Docker Compose ignores it and warns if it is present.
name: shopfront  # project name, used as a prefix for containers, networks and volumes

# Keys starting with "x-" are extension fields: Compose ignores them, YAML can reuse them.
# "&common" is a YAML anchor: it names this block so we can paste it below with *common.
x-common: &common
  restart: unless-stopped  # DONE(1): restart after crashes and reboots, unless you stopped it
  logging:
    driver: json-file  # Docker's default log driver, written to disk
    options:
      max-size: "10m"  # DONE(2): rotate each log file at 10 MB (quoted: Docker wants a string)
      max-file: "3"  # keep 3 old files, so logs never fill the disk

services:
  # Public entry point: TLS and routing to the API.
  proxy:
    <<: *common  # "<<" merges the anchored block here (restart + logging)
    image: nginx:1.27-alpine  # DONE(3): pinned nginx version on a small Alpine base
    ports:
      - "80:80"  # host:container, quoted so YAML keeps it as text
      - "443:443"  # DONE(4): HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro  # our config, read-only (:ro)
      - ./nginx/certs:/etc/nginx/certs:ro  # TLS certificates, read-only
    depends_on:
      api:
        condition: service_healthy  # DONE(5): wait until the API's healthcheck passes
    healthcheck:
      # Exec form: a list, no shell. Needs a /healthz location in nginx.conf.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s  # check every 30 seconds
      timeout: 5s  # a check slower than this counts as failed
      retries: 3  # 3 failures in a row = unhealthy
    networks:
      - public  # reachable from the internet through the published ports
      - internal  # can talk to the API
    deploy:
      resources:
        limits:
          cpus: "0.50"  # at most half a CPU core (quoted: Compose expects a string)
          memory: 128M  # hard memory cap

  # The Node/Express API, built from our own Dockerfile.
  api:
    <<: *common  # same restart + logging settings
    build:
      context: ./api  # DONE(6): folder with the API's Dockerfile and source
      dockerfile: Dockerfile  # file name inside that folder
    environment:
      NODE_ENV: production  # enables Express production optimisations
      PORT: "3000"  # quoted: environment values must be strings
      DATABASE_URL: "postgresql://app@db:5432/shop"  # "db" is the service name = hostname
      DATABASE_PASSWORD_FILE: /run/secrets/db_password  # the app reads the password from here
      REDIS_URL: "redis://cache:6379"  # "cache" is the Redis service name
    secrets:
      - db_password  # mounted as the file /run/secrets/db_password
    expose:
      - "3000"  # open to other containers only, not to the host
    depends_on:
      db:
        condition: service_healthy  # start only after Postgres accepts connections
      cache:
        condition: service_healthy  # and after Redis answers PING
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]  # assumes an Alpine-based image
      interval: 30s  # check every 30 seconds
      timeout: 5s  # fail a check that hangs
      retries: 3  # unhealthy after 3 failures
      start_period: 20s  # grace time while Node boots
    networks:
      - internal  # never exposed to the internet directly
    deploy:
      resources:
        limits:
          cpus: "1.0"  # at most one CPU core
          memory: 512M  # DONE(7): cap the API at 512 MB

  # PostgreSQL database.
  db:
    <<: *common  # same restart + logging settings
    image: postgres:16  # PostgreSQL major version 16
    environment:
      POSTGRES_USER: app  # user created on first start
      POSTGRES_DB: shop  # database created on first start
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password  # password from the secret, not plain text
    secrets:
      - db_password  # same secret the API uses
    volumes:
      - db-data:/var/lib/postgresql/data  # named volume: data survives container rebuilds
    # DONE(8): only report healthy once Postgres accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shop"]  # CMD-SHELL runs the string in a shell
      interval: 10s  # check every 10 seconds
      timeout: 5s  # fail a check that hangs
      retries: 5  # unhealthy after 5 failures
      start_period: 30s  # first start can take a while
    networks:
      - internal  # only the API can reach it

  # Redis cache.
  cache:
    <<: *common  # same restart + logging settings
    image: redis:7-alpine  # Redis 7 on Alpine
    command: ["redis-server", "--appendonly", "yes"]  # save writes to disk too
    volumes:
      - redis-data:/data  # named volume for Redis's append-only file
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]  # healthy when Redis replies PONG
      interval: 10s  # check every 10 seconds
      timeout: 3s  # Redis answers fast
      retries: 5  # unhealthy after 5 failures
    networks:
      - internal  # private

networks:
  public:
    driver: bridge  # normal network with internet access
  internal:
    driver: bridge  # same driver...
    internal: true  # DONE(9): ...but no route to the internet

# Named volumes live outside containers; an empty value means "use the defaults".
volumes:
  db-data:  # Postgres files
  redis-data:  # Redis files

# File-based secrets: Compose mounts the file into containers that list the secret.
secrets:
  db_password:
    file: ./secrets/db_password.txt  # DONE(10): keep this file out of git (.gitignore)

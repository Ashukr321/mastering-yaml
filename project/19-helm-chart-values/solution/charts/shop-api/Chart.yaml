# =====================================================================
# Project 19 · Helm Chart & Values                        Level: ⭐⭐⭐⭐
# File: charts/shop-api/Chart.yaml
# Scenario: The platform team packages the shop API as a Helm chart so every environment
#           installs it the same way, with a PostgreSQL database pulled in as a dependency.
# Solution: every TODO is answered and marked DONE(n).
# Check: yamllint --strict .   then compare with ../solution
# =====================================================================
---
apiVersion: v2  # Helm 3 charts use v2 (v1 was Helm 2); v2 is required for `dependencies` in this file
name: shop-api  # the chart name; must match the folder name charts/shop-api
description: Helm chart for the Shop API (Node.js) and its PostgreSQL database  # shown by `helm search`
type: application  # an installable app (the other type, library, only holds shared template helpers)
# the version of the CHART itself (SemVer). Bump it on every change to templates or values.
version: "0.3.0"  # DONE(1): chart version 0.3.0, quoted like every version string
# the version of the APP inside (your image tag). Always quote it: a bare 2.10 becomes the number 2.1
appVersion: "2.3.0"  # DONE(2): app version 2.3.0, quoted
kubeVersion: ">=1.28.0-0"  # refuse to install on clusters older than 1.28 (quoted: starts with >)
keywords:  # words that help people find the chart
  - shop  # the product
  - nodejs  # the runtime
  - api  # what it is
home: https://github.com/acme/shop-api  # project home page
maintainers:  # who looks after the chart
  - name: Platform Team  # a person or team name
    email: platform@example.com  # how to reach them
dependencies:  # other charts installed together with this one; fetch them with `helm dependency update`
  - name: postgresql  # the chart name in that repository
    # a version RANGE: any 16.x.x release; the exact pick is locked in Chart.lock
    version: "16.x.x"  # DONE(3): the range "16.x.x", quoted
    # Bitnami publishes its charts as OCI images in Docker Hub
    repository: oci://registry-1.docker.io/bitnamicharts  # DONE(4): oci://registry-1.docker.io/bitnamicharts
    # only install the dependency when this values.yaml path is true; set it false to use a managed DB
    condition: postgresql.enabled  # DONE(5): the values path postgresql.enabled (no quotes, no {{ }})

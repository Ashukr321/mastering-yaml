<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-label="YAML key terminology: 24 terms with their symbols and meanings">
  <style>
    text { white-space: pre; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <rect width="1000" height="580" rx="18" fill="#0f172a"/>
  <text x="32" y="44" class="sans" font-size="24" font-weight="800" fill="#f8fafc">Key Terminology</text>
  <text x="32" y="68" class="sans" font-size="13" fill="#94a3b8">24 words you will meet in every YAML tutorial, error message and config file</text>

  <g><rect x="24" y="96" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="24" y="106" width="3" height="30" rx="1.5" fill="#e2e8f0"/><rect x="40" y="105" width="39" height="20" rx="5" fill="#e2e8f0" fill-opacity=".14"/><text x="47" y="119" class="mono" font-size="13" fill="#e2e8f0">---</text><text x="89.2" y="120" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Document start</text><text x="40" y="138" class="sans" font-size="12" fill="#94a3b8">begins one YAML document</text></g>
  <g><rect x="346" y="96" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="346" y="106" width="3" height="30" rx="1.5" fill="#e2e8f0"/><rect x="362" y="105" width="39" height="20" rx="5" fill="#e2e8f0" fill-opacity=".14"/><text x="369" y="119" class="mono" font-size="13" fill="#e2e8f0">...</text><text x="411.2" y="120" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Document end</text><text x="362" y="138" class="sans" font-size="12" fill="#94a3b8">optionally closes a document</text></g>
  <g><rect x="668" y="96" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="668" y="106" width="3" height="30" rx="1.5" fill="#e2e8f0"/><text x="684" y="120" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Stream</text><text x="684" y="138" class="sans" font-size="12" fill="#94a3b8">all documents in one file</text></g>
  <g><rect x="24" y="154" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="24" y="164" width="3" height="30" rx="1.5" fill="#e2e8f0"/><text x="40" y="178" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Node</text><text x="40" y="196" class="sans" font-size="12" fill="#94a3b8">any piece of data in the tree</text></g>
  <g><rect x="346" y="154" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="346" y="164" width="3" height="30" rx="1.5" fill="#86efac"/><rect x="362" y="163" width="39" height="20" rx="5" fill="#86efac" fill-opacity=".14"/><text x="369" y="177" class="mono" font-size="13" fill="#86efac">abc</text><text x="411.2" y="178" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Scalar</text><text x="362" y="196" class="sans" font-size="12" fill="#94a3b8">a single value (str, num, bool)</text></g>
  <g><rect x="668" y="154" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="668" y="164" width="3" height="30" rx="1.5" fill="#7dd3fc"/><rect x="684" y="163" width="48" height="20" rx="5" fill="#7dd3fc" fill-opacity=".14"/><text x="691" y="177" class="mono" font-size="13" fill="#7dd3fc">k: v</text><text x="741.6" y="178" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Mapping</text><text x="684" y="196" class="sans" font-size="12" fill="#94a3b8">key/value pairs (dict / object)</text></g>
  <g><rect x="24" y="212" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="24" y="222" width="3" height="30" rx="1.5" fill="#7dd3fc"/><rect x="40" y="221" width="39" height="20" rx="5" fill="#7dd3fc" fill-opacity=".14"/><text x="47" y="235" class="mono" font-size="13" fill="#7dd3fc">- x</text><text x="89.2" y="236" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Sequence</text><text x="40" y="254" class="sans" font-size="12" fill="#94a3b8">ordered list (array)</text></g>
  <g><rect x="346" y="212" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="346" y="222" width="3" height="30" rx="1.5" fill="#7dd3fc"/><text x="362" y="236" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Block style</text><text x="362" y="254" class="sans" font-size="12" fill="#94a3b8">structure by indentation</text></g>
  <g><rect x="668" y="212" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="668" y="222" width="3" height="30" rx="1.5" fill="#7dd3fc"/><rect x="684" y="221" width="73" height="20" rx="5" fill="#7dd3fc" fill-opacity=".14"/><text x="691" y="235" class="mono" font-size="13" fill="#7dd3fc">[ ] { }</text><text x="766.8" y="236" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Flow style</text><text x="684" y="254" class="sans" font-size="12" fill="#94a3b8">JSON-like inline syntax</text></g>
  <g><rect x="24" y="270" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="24" y="280" width="3" height="30" rx="1.5" fill="#fbbf24"/><rect x="40" y="279" width="31" height="20" rx="5" fill="#fbbf24" fill-opacity=".14"/><text x="47" y="293" class="mono" font-size="13" fill="#fbbf24">··</text><text x="80.8" y="294" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Indentation</text><text x="40" y="312" class="sans" font-size="12" fill="#94a3b8">spaces only = nesting level</text></g>
  <g><rect x="346" y="270" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="346" y="280" width="3" height="30" rx="1.5" fill="#64748b"/><rect x="362" y="279" width="22" height="20" rx="5" fill="#64748b" fill-opacity=".14"/><text x="369" y="293" class="mono" font-size="13" fill="#64748b">#</text><text x="394.4" y="294" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Comment</text><text x="362" y="312" class="sans" font-size="12" fill="#94a3b8">ignored by the parser</text></g>
  <g><rect x="668" y="270" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="668" y="280" width="3" height="30" rx="1.5" fill="#86efac"/><rect x="684" y="279" width="39" height="20" rx="5" fill="#86efac" fill-opacity=".14"/><text x="691" y="293" class="mono" font-size="13" fill="#86efac">abc</text><text x="733.2" y="294" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Plain scalar</text><text x="684" y="312" class="sans" font-size="12" fill="#94a3b8">unquoted, type is inferred</text></g>
  <g><rect x="24" y="328" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="24" y="338" width="3" height="30" rx="1.5" fill="#86efac"/><rect x="40" y="337" width="39" height="20" rx="5" fill="#86efac" fill-opacity=".14"/><text x="47" y="351" class="mono" font-size="13" fill="#86efac">' '</text><text x="89.2" y="352" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Single-quoted</text><text x="40" y="370" class="sans" font-size="12" fill="#94a3b8">literal text, no escapes</text></g>
  <g><rect x="346" y="328" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="346" y="338" width="3" height="30" rx="1.5" fill="#86efac"/><rect x="362" y="337" width="39" height="20" rx="5" fill="#86efac" fill-opacity=".14"/><text x="369" y="351" class="mono" font-size="13" fill="#86efac">" "</text><text x="411.2" y="352" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Double-quoted</text><text x="362" y="370" class="sans" font-size="12" fill="#94a3b8">supports \n \t escapes</text></g>
  <g><rect x="668" y="328" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="668" y="338" width="3" height="30" rx="1.5" fill="#c4b5fd"/><rect x="684" y="337" width="22" height="20" rx="5" fill="#c4b5fd" fill-opacity=".14"/><text x="691" y="351" class="mono" font-size="13" fill="#c4b5fd">|</text><text x="716.4" y="352" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Literal block</text><text x="684" y="370" class="sans" font-size="12" fill="#94a3b8">multi-line, keeps newlines</text></g>
  <g><rect x="24" y="386" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="24" y="396" width="3" height="30" rx="1.5" fill="#c4b5fd"/><rect x="40" y="395" width="22" height="20" rx="5" fill="#c4b5fd" fill-opacity=".14"/><text x="47" y="409" class="mono" font-size="13" fill="#c4b5fd">&gt;</text><text x="72.4" y="410" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Folded block</text><text x="40" y="428" class="sans" font-size="12" fill="#94a3b8">multi-line, folds into spaces</text></g>
  <g><rect x="346" y="386" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="346" y="396" width="3" height="30" rx="1.5" fill="#c4b5fd"/><rect x="362" y="395" width="56" height="20" rx="5" fill="#c4b5fd" fill-opacity=".14"/><text x="369" y="409" class="mono" font-size="13" fill="#c4b5fd">|- |+</text><text x="428.0" y="410" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Chomping</text><text x="362" y="428" class="sans" font-size="12" fill="#94a3b8">strip / keep final newlines</text></g>
  <g><rect x="668" y="386" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="668" y="396" width="3" height="30" rx="1.5" fill="#fbbf24"/><rect x="684" y="395" width="56" height="20" rx="5" fill="#fbbf24" fill-opacity=".14"/><text x="691" y="409" class="mono" font-size="13" fill="#fbbf24">&amp;name</text><text x="750.0" y="410" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Anchor</text><text x="684" y="428" class="sans" font-size="12" fill="#94a3b8">labels a node for reuse</text></g>
  <g><rect x="24" y="444" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="24" y="454" width="3" height="30" rx="1.5" fill="#fbbf24"/><rect x="40" y="453" width="56" height="20" rx="5" fill="#fbbf24" fill-opacity=".14"/><text x="47" y="467" class="mono" font-size="13" fill="#fbbf24">*name</text><text x="106.0" y="468" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Alias</text><text x="40" y="486" class="sans" font-size="12" fill="#94a3b8">reuses an anchored node</text></g>
  <g><rect x="346" y="444" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="346" y="454" width="3" height="30" rx="1.5" fill="#fbbf24"/><rect x="362" y="453" width="31" height="20" rx="5" fill="#fbbf24" fill-opacity=".14"/><text x="369" y="467" class="mono" font-size="13" fill="#fbbf24">&lt;&lt;</text><text x="402.8" y="468" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Merge key</text><text x="362" y="486" class="sans" font-size="12" fill="#94a3b8">merges an alias into a map</text></g>
  <g><rect x="668" y="444" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="668" y="454" width="3" height="30" rx="1.5" fill="#fca5a5"/><rect x="684" y="453" width="56" height="20" rx="5" fill="#fca5a5" fill-opacity=".14"/><text x="691" y="467" class="mono" font-size="13" fill="#fca5a5">!!str</text><text x="750.0" y="468" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Tag</text><text x="684" y="486" class="sans" font-size="12" fill="#94a3b8">forces a node's type</text></g>
  <g><rect x="24" y="502" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="24" y="512" width="3" height="30" rx="1.5" fill="#cbd5e1"/><rect x="40" y="511" width="22" height="20" rx="5" fill="#cbd5e1" fill-opacity=".14"/><text x="47" y="525" class="mono" font-size="13" fill="#cbd5e1">~</text><text x="72.4" y="526" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Null</text><text x="40" y="544" class="sans" font-size="12" fill="#94a3b8">no value (null, ~ or empty)</text></g>
  <g><rect x="346" y="502" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="346" y="512" width="3" height="30" rx="1.5" fill="#fca5a5"/><rect x="362" y="511" width="56" height="20" rx="5" fill="#fca5a5" fill-opacity=".14"/><text x="369" y="525" class="mono" font-size="13" fill="#fca5a5">%YAML</text><text x="428.0" y="526" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Directive</text><text x="362" y="544" class="sans" font-size="12" fill="#94a3b8">parser instruction before ---</text></g>
  <g><rect x="668" y="502" width="310" height="50" rx="10" fill="#020617" stroke="#1e293b"/><rect x="668" y="512" width="3" height="30" rx="1.5" fill="#fca5a5"/><text x="684" y="526" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Schema</text><text x="684" y="544" class="sans" font-size="12" fill="#94a3b8">rules that resolve types</text></g>

</svg>

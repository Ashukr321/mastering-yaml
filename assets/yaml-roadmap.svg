<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-label="Beginner roadmap: 8 steps from setup to real DevOps configs">
  <defs>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <style>
    text { white-space: pre; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }

    .flow { stroke-dasharray: 10 8; animation: flow 1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -18; } }

    /* ring bursts when the traveller passes a stop (10s loop, delays match the dot's position) */
    .ring { animation: ring 10s ease-out infinite both; transform-box: fill-box; transform-origin: center; }
    @keyframes ring { 0%, 7%, 100% { opacity: 0; transform: scale(1); } 1% { opacity: .9; transform: scale(1); } 7% { opacity: 0; transform: scale(2); } }
    .s1 { animation-delay: .3s; }  .s2 { animation-delay: 1.6s; } .s3 { animation-delay: 2.9s; } .s4 { animation-delay: 4.1s; }
    .s5 { animation-delay: 5.9s; } .s6 { animation-delay: 7.1s; } .s7 { animation-delay: 8.4s; } .s8 { animation-delay: 9.7s; }

    .flag { animation: wave 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: left bottom; }
    @keyframes wave { 50% { transform: skewY(-6deg); } }
  </style>

  <rect width="1000" height="390" rx="18" fill="#0f172a"/>
  <text x="32" y="44" class="sans" font-size="24" font-weight="800" fill="#f8fafc">Absolute Beginner Roadmap</text>
  <text x="32" y="68" class="sans" font-size="13" fill="#94a3b8">No experience needed. Follow the path one step at a time, about 1 hour per step.</text>

  <!-- the road -->
  <path d="M60 140 H880 C960 140 960 290 880 290 H90" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
  <path d="M60 140 H880 C960 140 960 290 880 290 H90" fill="none" stroke="url(#road)" stroke-width="3" class="flow"/>

  <!-- traveller -->
  <circle r="8" fill="#fbbf24">
    <animateMotion dur="10s" repeatCount="indefinite" path="M60 140 H880 C960 140 960 290 880 290 H90"/>
  </circle>

  <!-- stops: row 1 (left → right) -->
  <g class="sans" text-anchor="middle">
    <g>
      <circle class="ring s1" cx="120" cy="140" r="22" fill="none" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="120" cy="140" r="22" fill="#082f49" stroke="#38bdf8" stroke-width="2"/>
      <text x="120" y="146" font-size="16" font-weight="800" fill="#7dd3fc">1</text>
      <text x="120" y="190" font-size="14" font-weight="700" fill="#f8fafc">Setup</text>
      <text x="120" y="208" font-size="12" fill="#94a3b8">VS Code + YAML extension</text>
    </g>
    <g>
      <circle class="ring s2" cx="360" cy="140" r="22" fill="none" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="360" cy="140" r="22" fill="#082f49" stroke="#38bdf8" stroke-width="2"/>
      <text x="360" y="146" font-size="16" font-weight="800" fill="#7dd3fc">2</text>
      <text x="360" y="190" font-size="14" font-weight="700" fill="#f8fafc">key: value</text>
      <text x="360" y="208" font-size="12" fill="#94a3b8">your very first file</text>
    </g>
    <g>
      <circle class="ring s3" cx="600" cy="140" r="22" fill="none" stroke="#818cf8" stroke-width="3"/>
      <circle cx="600" cy="140" r="22" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
      <text x="600" y="146" font-size="16" font-weight="800" fill="#a5b4fc">3</text>
      <text x="600" y="190" font-size="14" font-weight="700" fill="#f8fafc">Data types</text>
      <text x="600" y="208" font-size="12" fill="#94a3b8">string · number · bool · null</text>
    </g>
    <g>
      <circle class="ring s4" cx="840" cy="140" r="22" fill="none" stroke="#a78bfa" stroke-width="3"/>
      <circle cx="840" cy="140" r="22" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/>
      <text x="840" y="146" font-size="16" font-weight="800" fill="#c4b5fd">4</text>
      <text x="840" y="190" font-size="14" font-weight="700" fill="#f8fafc">Indentation</text>
      <text x="840" y="208" font-size="12" fill="#94a3b8">2 spaces = nesting</text>
    </g>

    <!-- row 2 (right → left) -->
    <g>
      <circle class="ring s5" cx="840" cy="290" r="22" fill="none" stroke="#c084fc" stroke-width="3"/>
      <circle cx="840" cy="290" r="22" fill="#3b0764" stroke="#c084fc" stroke-width="2"/>
      <text x="840" y="296" font-size="16" font-weight="800" fill="#d8b4fe">5</text>
      <text x="840" y="340" font-size="14" font-weight="700" fill="#f8fafc">Lists</text>
      <text x="840" y="358" font-size="12" fill="#94a3b8" class="mono">- item</text>
    </g>
    <g>
      <circle class="ring s6" cx="600" cy="290" r="22" fill="none" stroke="#e879f9" stroke-width="3"/>
      <circle cx="600" cy="290" r="22" fill="#4a044e" stroke="#e879f9" stroke-width="2"/>
      <text x="600" y="296" font-size="16" font-weight="800" fill="#f0abfc">6</text>
      <text x="600" y="340" font-size="14" font-weight="700" fill="#f8fafc">Lists of maps</text>
      <text x="600" y="358" font-size="12" fill="#94a3b8">the shape of real configs</text>
    </g>
    <g>
      <circle class="ring s7" cx="360" cy="290" r="22" fill="none" stroke="#f472b6" stroke-width="3"/>
      <circle cx="360" cy="290" r="22" fill="#500724" stroke="#f472b6" stroke-width="2"/>
      <text x="360" y="296" font-size="16" font-weight="800" fill="#f9a8d4">7</text>
      <text x="360" y="340" font-size="14" font-weight="700" fill="#f8fafc">Multi-line &amp; anchors</text>
      <text x="360" y="358" font-size="12" fill="#94a3b8" class="mono">|  &gt;  &amp;  *</text>
    </g>
    <g>
      <circle class="ring s8" cx="120" cy="290" r="22" fill="none" stroke="#fbbf24" stroke-width="3"/>
      <circle cx="120" cy="290" r="22" fill="#451a03" stroke="#fbbf24" stroke-width="2"/>
      <text x="120" y="296" font-size="16" font-weight="800" fill="#fcd34d">8</text>
      <text x="120" y="340" font-size="14" font-weight="700" fill="#f8fafc">Real configs</text>
      <text x="120" y="358" font-size="12" fill="#94a3b8">Docker · Actions · K8s</text>
    </g>
  </g>

  <!-- finish flag -->
  <g transform="translate(36 236)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#e2e8f0" stroke-width="2"/>
    <path class="flag" d="M1 1 H24 L18 9 L24 17 H1 Z" fill="#4ade80"/>
  </g>
  <text x="62" y="250" class="sans" font-size="11" font-weight="700" fill="#4ade80">DevOps ready!</text>
</svg>
